name: Harness Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  docs_lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint harness docs
        run: |
          python scripts/ci/he-docs-lint.py
          python scripts/ci/he-specs-lint.py
          python scripts/ci/he-plans-lint.py
          python scripts/ci/he-spikes-lint.py

  docs_drift:
    name: Docs Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enforce doc updates on relevant changes
        run: python scripts/ci/he-docs-drift.py
